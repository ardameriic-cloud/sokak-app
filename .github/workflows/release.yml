name: SOKAK Desktop Release (.exe & .dmg)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (SOKAK-Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build SOKAK Windows Installer (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://sokak-server.onrender.com' }}
        run: npm run build:win

      - name: Upload SOKAK-Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOKAK-Windows-Installer-exe
          path: |
            release/*/SOKAK-Setup.exe
            release/*/latest.yml
            release/*/*.blockmap
          if-no-files-found: error

  build-macos:
    name: Build macOS Installer (SOKAK.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build SOKAK macOS Installer (.dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://sokak-server.onrender.com' }}
        run: npm run build:mac

      - name: Upload SOKAK.dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOKAK-macOS-Installer-dmg
          path: |
            release/*/SOKAK.dmg
            release/*/latest-mac.yml
            release/*/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SOKAK-Windows-Installer-exe
          path: artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SOKAK-macOS-Installer-dmg
          path: artifacts/macos

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.6' }}
          name: 'SOKAK v1.1.6 — Masaüstü Kurulum Paketleri (Windows .exe & macOS .dmg)'
          body: |
            ## ⚡ SOKAK v1.1.6 — Masaüstü İndirme Paketleri
            - **Windows 10/11 (64-bit):** `SOKAK-Setup.exe`
            - **macOS (Apple Silicon):** `SOKAK.dmg`
            - **Yenilikler (v1.1.6 — Performans ve Oyun İçi Deneyim Paketi):**
              - ⚡ **Oyun Modu (`data-game-mode="true"` & Otomatik Tetikleme):** Valorant, CS2, LoL, EA FC vb. algılandığında otomatik devreye giren Düşük Gecikmeli Oyun Modu, arka planda `1-2 FPS` uyku modu ve `app.disableHardwareAcceleration()` kalıcı donanım hızlandırma ayarı.
              - 🎚️ **Kişi Bazlı Ses (%0–%200 `GainNode`) & `AudioWorklet` Gürültü Filtresi:** Her kullanıcı için `%0–%200` Web Audio `GainNode` ses yükseltici, `AudioWorklet` tabanlı 85Hz gürültü filtresi + VAD eşiği ve `noiseSuppression` / `echoCancellation` / `autoGainControl` anahtarları.
              - ⌨️ **Global Kısayollar (Keybinds) & Bas-Konuş (Push-to-Talk — 200ms Release Delay):** Özelleştirilebilir global kısayollar, 200ms bırakma gecikmeli Bas-Konuş ve oyun içi Web Audio sesli geri bildirim (Audio Cue).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/windows/**/SOKAK-Setup.exe
            artifacts/windows/**/latest.yml
            artifacts/windows/**/*.blockmap
            artifacts/macos/**/SOKAK.dmg
            artifacts/macos/**/latest-mac.yml
            artifacts/macos/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
