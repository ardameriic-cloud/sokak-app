services:
  - type: web
    name: sokak-server
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --omit=dev
    startCommand: node dist-server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
